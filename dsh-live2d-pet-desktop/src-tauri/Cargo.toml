[package]
name = "dsh-pet-live2d-desktop"
version = "0.1.0"
description = "DSH Live2D 桌宠的桌面端外壳（单文件 exe：透明常驻窗 + 逐像素穿透 + 托盘）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_pet_live2d_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# 单文件分发：体积与启动速度都算钱。strip 掉符号，LTO 拉满，按体积优化。
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
