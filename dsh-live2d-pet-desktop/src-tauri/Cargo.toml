[package]
name = "dsh-pet-live2d-desktop"
version = "0.1.0"
description = "DSH Live2D 桌宠的桌面端外壳（单文件 exe：透明常驻窗 + 逐像素穿透 + 托盘）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_pet_live2d_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api`：透明窗背景在 macOS 上要用 tauri 的私有 API 开关。
#
# 为什么写在**顶层**而不是 `[target.'cfg(target_os = "macos")'.dependencies]` —— 踩过：
# `tauri-build` 会拿 `tauri.conf.json` 的 `macOSPrivateApi` 去核 manifest 里的 feature，而它
# 的查找顺序是"先顶层 `[dependencies]`，只在顶层没有时才翻 target 段"。我们顶层有 `tauri`，
# 于是 target 段那份声明它**根本看不见** ⇒ Windows 上也报
#   "The `tauri` dependency features ... does not match the allowlist"。
# 写在顶层也正是 `tauri dev/build` 自己会做的（它改的就是这一行）。代价：Windows 构建也会
# 带上它带来的 `wry/transparent` + `wry/fullscreen`（`tauri-runtime/macos-private-api` 本身
# 是空 feature）。这一条**必须回归**：桌面端驱动 + 网页端 suite 都跑过才算数。
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`：**JSON 对象的键顺序必须与文件里的顺序一致**。
# serde_json 默认用 BTreeMap（字典序），于是 `FileReferences.Motions` 会变成
# BubbleGum / Hammer / Idle…，而 JS 的 `Object.entries()` 给的是文件里的声明顺序
# （Idle 在前）—— 右键面板的「动作」页签是按这个顺序排的，用户看到的第一项会不一样。
# 对拍就是靠这一条抓出来的。
serde_json = { version = "1", features = ["preserve_order"] }
# 随包宠物的内容指纹（.synced.json 的判定靠它）。
sha2 = "0.10"
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
# `Win32_UI_Shell` 是给托盘诊断用的：`Shell_NotifyIconW` / `NOTIFYICONDATAW` 在 Shell 里，
# 不在 WindowsAndMessaging（一开始就是按后者找的，编译期直接报 unresolved import）。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

# 顺带记一条同源但不同 feature 的坑：`skip_taskbar(true)` 在 macOS 上**没有实现**
# （tauri-runtime-wry 的 macOS 分支是空函数，tao 也只给 Windows/Linux 写了实现），
# 那边靠 `ActivationPolicy::Accessory` 才藏得住"不在程序坞里"——见 `src/lib.rs` 的 setup。

# 单文件分发：体积与启动速度都算钱。strip 掉符号，LTO 拉满，按体积优化。
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
