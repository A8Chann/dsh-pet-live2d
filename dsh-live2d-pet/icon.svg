<!--
  dsh-pet-live2d 的插件图标（原创几何图形，不含模型的任何美术素材 ——
  模型是 B站@氵六青 的 DS鲸鱼娘，授权与这个图标无关）。

  用途：DSH 侧栏「插件」页、设置 → 内置插件列表里这张卡片的图标。
  宿主的读法（`dsh-app-boot` 的 `readPluginMeta` → `iconOf`）：
  package.json 的 `"icon": "./icon.svg"`，或导出的 `./icon` 子路径；
  必须是**包目录内的相对路径**，SVG / PNG / JPEG / WebP，≤256 KiB。
  它以 `data:image/svg+xml;base64,…` 塞进 `<img width=36 height=36>`，
  `object-fit:contain` —— 所以画布按 36×36 画、图形留一点边距，
  且**不能依赖 currentColor**（img 里没有继承），颜色一律写死。

  几何约定：所有图形都在 0…36 的 viewBox 内；尾鳍画在身体**之前**，
  它靠左下那只角（10,20.4）藏在身体里，看起来才是连着的。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="Live2D pet">
  <title>Live2D 桌宠</title>
  <defs>
    <linearGradient id="pet-tile" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#7FB0FF"/>
      <stop offset="1" stop-color="#3B5DD4"/>
    </linearGradient>
  </defs>

  <!-- 底：一块圆角砖。浅色与深色主题下都要能看见，所以自带底色而不是只描线。 -->
  <rect x="0.6" y="0.6" width="34.8" height="34.8" rx="9.4" fill="url(#pet-tile)"/>

  <!-- 头顶冒出来的那颗心（对应她的「冒爱心」表情） -->
  <g fill="#FFB4D2">
    <circle cx="12.7" cy="7.7" r="2"/>
    <circle cx="16.5" cy="7.7" r="2"/>
    <path d="M10.6 8.4h8l-4 4.3z"/>
  </g>

  <!-- 尾鳍（左下角压在身体下面） -->
  <path d="M10 20.4 2.2 12.4l8.6.8z" fill="#D8E6FF"/>

  <!-- 身体 -->
  <ellipse cx="17.6" cy="21" rx="13" ry="7.4" fill="#FFFFFF"/>

  <!-- 眼睛 / 嘴 / 腮红 -->
  <circle cx="23.6" cy="19.9" r="1.7" fill="#1E2A4C"/>
  <path d="M21.7 23.6c1 1 2.3 1 3.3 0" fill="none" stroke="#1E2A4C" stroke-width="1" stroke-linecap="round" opacity=".9"/>
  <ellipse cx="18.9" cy="24" rx="1.9" ry="1.1" fill="#FFA6C8"/>
</svg>
